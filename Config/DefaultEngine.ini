; ===========================================================================
;  ECHO - DefaultEngine.ini
;  Target: Windows 11 laptop, Ryzen AI 9 365 + Radeon 880M (integrated RDNA 3.5),
;  32 GB RAM. Fully dynamic lighting (Lumen + Virtual Shadow Maps), DX12 / SM6.
;  Editor gets a lighter [SystemSettingsEditor] block; Movie Render Queue raises
;  quality per render through its own console-variable setting (see render.py).
; ===========================================================================

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/ECHO/Maps/L_Prologue_Gala.L_Prologue_Gala
GameDefaultMap=/Game/ECHO/Maps/L_Prologue_Gala.L_Prologue_Gala
; setup.ps1 rewrites this line if the Third Person template lives elsewhere
GlobalDefaultGameMode=/Game/ThirdPerson/Blueprints/BP_ThirdPersonGameMode.BP_ThirdPersonGameMode_C

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; --- Global illumination & reflections: Lumen (software tracing; HW RT off for the iGPU) ---
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=False
r.Lumen.TraceMeshSDFs=1
r.GenerateMeshDistanceFields=True
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True
r.RayTracing=False
; --- Shadows: Virtual Shadow Maps ---
r.Shadow.Virtual.Enable=1
; --- Fully dynamic project: no lightmaps to bake ---
r.AllowStaticLighting=False
; --- Geometry ---
r.Nanite.ProjectEnabled=True
; --- Atmosphere / fog / post ---
r.VolumetricFog=1
r.SupportSkyAtmosphere=True
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.Bloom=True
r.AntiAliasingMethod=4
r.CustomDepth=3
r.SkinCache.CompileShaders=True
r.Substrate=False

[SystemSettingsEditor]
; ---- Editor-only performance tuning for the Radeon 880M (integrated) ----
; Lumen stays ON (needs GI/Reflection scalability >= High), but cheaper:
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.MaxRoughnessToTrace=0.35
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=64
r.Shadow.Virtual.ResolutionLodBiasLocal=1.0
r.Shadow.Virtual.SMRT.RayCountLocal=4
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=2
r.DepthOfFieldQuality=1
r.MotionBlurQuality=2
r.BloomQuality=4
r.SSS.Quality=0
r.VSync=0

[/Script/AndroidFileServerEditor.AndroidFileServerRuntimeSettings]
bEnablePlugin=False

[/Script/Engine.UserInterfaceSettings]
bAuthorizeAutomaticWidgetVariableCreation=False

[DevOptions.Shaders]
; Use most CPU cores for the (long) first shader compile on the Ryzen AI 9
NumUnusedShaderCompilingThreads=2
bAllowShaderJobCache=True
